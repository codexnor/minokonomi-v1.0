<script>
(()=>{'use strict';
const ICON={overview:'<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/>',transactions:'<path d="M4 7h16M4 12h16M4 17h16"/><path d="M7 4v6M17 14v6"/>',budget:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 15h3"/>',goals:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 13.5a7 7 0 0 0 0-3l2-1.5-2-3.5-2.4.8a8 8 0 0 0-2.6-1.5L13.5 2h-3L10 4.8a8 8 0 0 0-2.6 1.5L5 5.5 3 9l2 1.5a7 7 0 0 0 0 3L3 15l2 3.5 2.4-.8a8 8 0 0 0 2.6 1.5l.5 2.8h3l.5-2.8a8 8 0 0 0 2.6-1.5l2.4.8 2-3.5-2-1.5Z"/>',plus:'<path d="M12 5v14M5 12h14"/>',left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',up:'<path d="m7 14 5-5 5 5"/><path d="M12 9v11"/>',down:'<path d="m7 10 5 5 5-5"/><path d="M12 4v11"/>',wallet:'<rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 9h18"/><path d="M16 15h2"/>',shield:'<path d="m12 2 8 4v5c0 5-3 8-8 11-5-3-8-6-8-11V6z"/><path d="m9 12 2 2 4-4"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 10h18"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/>',upload:'<path d="M12 17V4m-5 5 5-5 5 5M4 16v5h16v-5"/>',check:'<path d="m5 12 4 4L19 6"/>',trash:'<path d="M4 7h16m-10 4v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/>',edit:'<path d="m16 4 4 4-12 12H4v-4L16 4Z"/>',close:'<path d="M5 5l14 14M19 5 5 19"/>',lock:'<rect x="5" y="10" width="14" height="12" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',spark:'<path d="m12 2 2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3L12 2Z"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',repeat:'<path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"/>',filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7h.01"/>'};
const ico=(name,size=19)=>`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]||ICON.info}</svg>`;
const NAV=[['overview','Oversikt'],['transactions','Posteringer'],['budget','Budsjett'],['goals','Sparemål'],['settings','Innstillinger']];
const COLORS=['#4a7de4','#24a7a4','#ed9c46','#a375db','#d86678','#6090b7','#7faf62','#c8894c','#ba7d95','#586fd1','#9c9caa','#3bb5aa'];
const CATEGORIES=[{id:'housing',name:'Bolig',emoji:'🏠',color:COLORS[0],kind:'expense'},{id:'food',name:'Mat og dagligvarer',emoji:'🛒',color:COLORS[1],kind:'expense'},{id:'car',name:'Bil og transport',emoji:'🚗',color:COLORS[2],kind:'expense'},{id:'insurance',name:'Forsikringer',emoji:'🛡️',color:COLORS[3],kind:'expense'},{id:'utilities',name:'Strøm og internett',emoji:'💡',color:COLORS[4],kind:'expense'},{id:'family',name:'Barn og familie',emoji:'👨‍👩‍👧‍👦',color:COLORS[5],kind:'expense'},{id:'subscriptions',name:'Abonnement',emoji:'📺',color:COLORS[6],kind:'expense'},{id:'health',name:'Helse',emoji:'❤️',color:COLORS[7],kind:'expense'},{id:'leisure',name:'Fritid og ferie',emoji:'✈️',color:COLORS[8],kind:'expense'},{id:'other',name:'Annet',emoji:'📦',color:COLORS[9],kind:'expense'},{id:'salary',name:'Lønn',emoji:'💼',color:'#1a9f82',kind:'income'},{id:'refund',name:'Tilbakebetaling',emoji:'↩️',color:'#2a9d8f',kind:'income'},{id:'otherincome',name:'Annen inntekt',emoji:'✨',color:'#78a179',kind:'income'}];
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const localDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const thisMonth=()=>localDate().slice(0,7); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=amt=>{let n=(Number(amt)||0)/100;return new Intl.NumberFormat('nb-NO',{style:'currency',currency:'NOK',minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2}).format(n)};
const fmtShort=amt=>new Intl.NumberFormat('nb-NO',{maximumFractionDigits:0}).format((Number(amt)||0)/100)+' kr';
const parseAmount=v=>{const s=String(v??'').trim().replace(/[\s\u00a0\u202f]/g,'').replace('kr','').replace(',','.');if(!/^\d+(?:\.\d{1,2})?$/.test(s))return null;const n=Math.round(Number(s)*100);return Number.isSafeInteger(n)&&n>0?n:null};
const inputMoney=c=>(Number(c||0)/100).toFixed(2).replace('.',',');
const dateText=date=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return String(date||'');return new Date(date+'T12:00:00').toLocaleDateString('nb-NO',{day:'2-digit',month:'short',year:'numeric'})};
const monthName=m=>new Date(m+'-15T12:00:00').toLocaleDateString('nb-NO',{month:'long',year:'numeric'});
const shiftMonth=(m,n)=>{const [y,mon]=m.split('-').map(Number);const d=new Date(y,mon-1+n,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
const initial=()=>({schema:1,settings:{theme:'system',hideBalances:false},accounts:[{id:'daily',name:'Brukskonto',opening:0,color:'#4a7de4'},{id:'shared',name:'Felleskonto',opening:0,color:'#24a7a4'},{id:'savings',name:'Sparekonto',opening:0,color:'#9f77d5'}],categories:CATEGORIES,transactions:[],budgets:{},recurring:[],goals:[],contributions:[]});
let state=initial(),page='overview',period=thisMonth(),txFilter='all',txSearch='',txAccount='all',db=null,storageMode='indexeddb',saveChain=Promise.resolve(),toastTimer=0;
const byId=id=>state.accounts.find(x=>x.id===id);
const category=id=>state.categories.find(x=>x.id===id)||{name:'Ukjent kategori',emoji:'📦',color:'#92a0b1',kind:'expense'};
const accountBalance=id=>state.accounts.find(a=>a.id===id)?.opening + state.transactions.reduce((s,t)=>s+(t.accountId===id?(t.kind==='income'?t.amount:-t.amount):0)+(t.kind==='transfer'&&t.toAccountId===id?t.amount:0),0);
const monthTx=m=>state.transactions.filter(t=>t.date?.startsWith(m));
const expenses=m=>monthTx(m).filter(t=>t.kind==='expense');
const monthly=m=>{const tx=monthTx(m);const income=tx.filter(t=>t.kind==='income').reduce((s,t)=>s+t.amount,0);const expense=tx.filter(t=>t.kind==='expense').reduce((s,t)=>s+t.amount,0);return {income,expense,net:income-expense};};
const spentByCategory=(m,id)=>expenses(m).filter(t=>t.categoryId===id).reduce((s,t)=>s+t.amount,0);
const budgetFor=(m,id)=>state.budgets[m]?.[id]||0;
const totalBudget=m=>Object.values(state.budgets[m]||{}).reduce((s,n)=>s+Number(n||0),0);
const goalsSaved=id=>state.contributions.filter(x=>x.goalId===id).reduce((s,x)=>s+x.amount,0);
const summary=(label,amount)=>`<div class="summary-pill"><span>${label}</span><strong class="private-value">${fmt(amount)}</strong></div>`;
function notify(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3600)}
function errorMessage(e){notify('Kunne ikke lagre: '+String(e?.message||e));console.error(e)}
function openDb(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB ikke støttet'));return}const rq=indexedDB.open('minokonomi-private-v1',1);rq.onupgradeneeded=()=>{if(!rq.result.objectStoreNames.contains('app'))rq.result.createObjectStore('app')};rq.onsuccess=()=>resolve(rq.result);rq.onerror=()=>reject(rq.error)})}
function dbGet(){return new Promise((resolve,reject)=>{const rq=db.transaction('app','readonly').objectStore('app').get('data');rq.onsuccess=()=>resolve(rq.result);rq.onerror=()=>reject(rq.error)})}
function dbSet(snapshot){return new Promise((resolve,reject)=>{const tr=db.transaction('app','readwrite');tr.objectStore('app').put(snapshot,'data');tr.oncomplete=resolve;tr.onerror=()=>reject(tr.error)})}
async function initStorage(){try{db=await openDb();const data=await dbGet();if(data&&validData(data))state=normalizeData(data)}catch(e){storageMode='localstorage';try{const data=localStorage.getItem('minokonomi-private-v1');if(data){const parsed=JSON.parse(data);if(validData(parsed))state=normalizeData(parsed)}}catch(e2){storageMode='volatile';console.warn('Ingen varig lagring tilgjengelig',e2)}}}
function validData(d){
  const integer=n=>Number.isSafeInteger(n), money=n=>integer(n)&&n>0;
  return !!(d&&typeof d==='object'&&d.schema===1&&
    Array.isArray(d.accounts)&&d.accounts.every(a=>typeof a.id==='string'&&typeof a.name==='string'&&integer(a.opening))&&
    Array.isArray(d.transactions)&&d.transactions.every(t=>typeof t.id==='string'&&['income','expense','transfer'].includes(t.kind)&&money(t.amount)&&/^\d{4}-\d{2}-\d{2}$/.test(t.date||'')&&typeof t.accountId==='string')&&
    Array.isArray(d.categories)&&d.budgets&&typeof d.budgets==='object'&&!Array.isArray(d.budgets)&&Object.values(d.budgets).every(b=>b&&typeof b==='object'&&Object.values(b).every(money))&&
    Array.isArray(d.goals)&&d.goals.every(g=>typeof g.id==='string'&&typeof g.name==='string'&&money(g.target))&&
    Array.isArray(d.contributions)&&d.contributions.every(c=>typeof c.goalId==='string'&&money(c.amount))&&
    Array.isArray(d.recurring)&&d.recurring.every(r=>typeof r.id==='string'&&typeof r.name==='string'&&money(r.amount)&&integer(r.day)&&r.day>=1&&r.day<=31));
} 
function normalizeData(d){return {...initial(),...d,categories:CATEGORIES,settings:{...initial().settings,...(d.settings||{})}}}
function commit(message){const snapshot=JSON.parse(JSON.stringify(state));saveChain=saveChain.then(async()=>{if(storageMode==='indexeddb')await dbSet(snapshot);else if(storageMode==='localstorage')localStorage.setItem('minokonomi-private-v1',JSON.stringify(snapshot));else throw new Error('Lagring er ikke tilgjengelig. Eksporter sikkerhetskopi.')}).then(()=>{if(message)notify(message)}).catch(errorMessage);render()}
function theme(){document.documentElement.dataset.theme=state.settings.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):state.settings.theme;document.body.classList.toggle('balance-hidden',!!state.settings.hideBalances);document.querySelector('meta[name="theme-color"]').content=document.documentElement.dataset.theme==='dark'?'#0c1422':'#f5f7fb'}
const empty=(title,desc,action='',label='')=>`<div class="empty"><div class="empty-icon">${ico('spark',23)}</div><strong>${title}</strong><p>${desc}</p>${action?`<button class="btn btn-secondary btn-sm" data-action="${action}">${esc(label||'Kom i gang')}</button>`:''}</div>`;
function navRender(){document.querySelector('#brand-icon').innerHTML=ico('wallet',23);document.querySelector('#desktop-nav').innerHTML=NAV.map(([id,name])=>`<button class="nav-btn ${page===id?'active':''}" data-action="page" data-page="${id}">${ico(id,19)}${name}</button>`).join('');document.querySelector('#bottom-nav').innerHTML=NAV.map(([id,name])=>`<button class="bottom-btn ${page===id?'active':''}" data-action="page" data-page="${id}" aria-label="${name}">${ico(id,21)}<span>${name}</span></button>`).join('');document.querySelector('#fab').innerHTML=ico('plus',24);document.querySelector('#fab').style.display=page==='settings'?'none':'';document.querySelector('#modal-close').innerHTML=ico('close',20);document.querySelector('#offline-alert').classList.toggle('show',!navigator.onLine)}
const head=(title,desc,button='',showPeriod=true)=>`<div class="topline"><div><div class="eyebrow">${page==='overview'?'PERSONLIG ØKONOMI':'MINØKONOMI'}</div><h1 class="page-title">${title}</h1><p class="subheading">${desc}</p></div><div class="top-actions">${showPeriod?`<div class="period"><button class="icon-btn" data-action="prev-month" aria-label="Forrige måned">${ico('left',18)}</button><span class="period-label">${monthName(period)}</span><button class="icon-btn" data-action="next-month" aria-label="Neste måned">${ico('right',18)}</button></div>`:''}${button}</div></div>`;
const accountTile=a=>`<div class="mini-card"><div class="account-mark" style="background:${esc(a.color)}20;color:${esc(a.color)}">${ico('wallet',17)}</div><p>${esc(a.name)}</p><strong class="private-value">${fmt(accountBalance(a.id))}</strong></div>`;
function transactionRow(t,edit=false){const cat=category(t.categoryId);const isTransfer=t.kind==='transfer';const label=isTransfer?`Overføring til ${byId(t.toAccountId)?.name||'konto'}`:(t.note?.trim()||cat.name);const emoji=isTransfer?'↔️':cat.emoji;const acc=byId(t.accountId)?.name||'Ukjent konto';const meta=`${dateText(t.date)} · ${esc(acc)}${t.kind==='income'?' · Inntekt':isTransfer?' · Overføring':''}`;return `<div class="tx-row"><div class="tx-ico">${esc(emoji)}</div><div class="tx-detail"><div class="tx-name">${esc(label)}</div><div class="tx-meta">${meta}</div></div><div class="tx-value ${t.kind} private-value">${t.kind==='expense'?'−':t.kind==='income'?'+':''}${fmt(t.amount)}</div>${edit?`<button class="small-btn" data-action="edit-transaction" data-id="${esc(t.id)}" aria-label="Rediger postering">${ico('edit',16)}</button>`:''}</div>`}
function topCategory(m){const items=state.categories.filter(c=>c.kind==='expense').map(c=>({cat:c,value:spentByCategory(m,c.id)})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);return items}
function donutCard(){const arr=topCategory(period),total=arr.reduce((s,x)=>s+x.value,0);let step=0;const stops=arr.length?arr.map((x,i)=>{const from=step;step+=(x.value/total)*100;return `${x.cat.color} ${from.toFixed(2)}% ${step.toFixed(2)}%`}).join(','):'var(--line) 0% 100%';return `<section class="card"><div class="card-head"><div><h2 class="card-title">Utgifter etter kategori</h2><p class="card-hint">Fordeling denne måneden</p></div></div>${arr.length?`<div class="donut-layout"><div class="donut" style="background:conic-gradient(${stops})"><div class="donut-center"><strong class="private-value">${fmtShort(total)}</strong><span>Totalt forbruk</span></div></div><div class="legend">${arr.slice(0,5).map(x=>`<div class="legend-row"><span class="legend-dot" style="background:${esc(x.cat.color)}"></span><span class="legend-name">${esc(x.cat.name)}</span><strong>${Math.round(x.value/total*100)} %</strong></div>`).join('')}${arr.length>5?`<div class="tiny muted">+ ${arr.length-5} kategorier</div>`:''}</div></div>`:empty('Ingen utgifter registrert','Når du registrerer utgifter, ser du hvordan pengene fordeler seg.')}</section>`}
function budgetCard(){const b=Object.entries(state.budgets[period]||{}).filter(([k,v])=>v>0).map(([id,v])=>({cat:category(id),used:spentByCategory(period,id),limit:v})).sort((a,b)=>b.used-a.used).slice(0,5);return `<section class="card"><div class="card-head"><div><h2 class="card-title">Budsjettstatus</h2><p class="card-hint">Forbruk mot planlagt ramme</p></div><button class="btn btn-ghost btn-sm" data-action="page" data-page="budget">Alle ${ico('right',15)}</button></div>${b.length?b.map(x=>`<div class="budget-row"><div class="budget-info"><span class="budget-name">${esc(x.cat.emoji)} ${esc(x.cat.name)}</span><span class="private-value">${fmtShort(x.used)} / ${fmtShort(x.limit)}</span></div><div class="progress ${x.used>x.limit?'warn':''}"><i style="width:${Math.min(100,Math.round(x.used/x.limit*100))}%"></i></div></div>`).join(''):empty('Budsjett er ikke satt opp','Angi et månedlig beløp for kategoriene dine.','page-budget','Opprett budsjett')}</section>`}
function upcomingCard(){const list=state.recurring.filter(r=>r.active!==false),pending=list.filter(r=>!state.transactions.some(t=>t.recurringId===r.id&&t.date.startsWith(period)));return `<section class="card"><div class="card-head"><div><h2 class="card-title">Faste poster</h2><p class="card-hint">Bokfør når betalingen er gjennomført</p></div><button class="btn btn-ghost btn-sm" data-action="add-recurring">${ico('plus',16)} Ny</button></div>${list.length?`${pending.slice(0,5).map(r=>`<div class="recurring-row"><div><strong>${esc(r.name)}</strong><p>${String(r.day).padStart(2,'0')}. hver måned · ${fmt(r.amount)} · ${esc(category(r.categoryId).name)}</p></div><button class="btn btn-secondary btn-sm" data-action="post-recurring" data-id="${esc(r.id)}" ${!byId(r.accountId)?'disabled':''}>Bokfør</button></div>`).join('')}${pending.length===0?`<div class="empty-strip">Alle faste poster er bokført for ${monthName(period)}.</div>`:''}${pending.length>5?`<div class="month-note">${pending.length-5} flere faste poster – se innstillinger.</div>`:''}`:empty('Ingen faste poster','Legg inn regninger eller andre gjentakende utgifter. De videreføres til alle måneder uten å telle som betalt før du bokfører dem.','add-recurring','Legg til fast post')}</section>`}
function dashboard(){const m=monthly(period),prev=monthly(shiftMonth(period,-1)),total=state.accounts.reduce((s,a)=>s+accountBalance(a.id),0),planned=totalBudget(period);const recent=monthTx(period).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);const budgets=planned>0?`${fmt(m.expense)} av ${fmt(planned)} budsjettert`:'Registrer kategoribudsjetter';return head('Din økonomiske oversikt','God oversikt starter med gode vaner.',`<button class="btn" data-action="add-transaction">${ico('plus',17)} Ny postering</button>`)+`<div class="grid-hero"><div class="hero"><div class="row between"><p>Samlet kontosaldo</p>${ico('wallet',21)}</div><div class="hero-value private-value">${fmt(total)}</div><div class="hero-bottom">${ico('shield',15)} Beregnet fra startsaldo og posteringer</div></div><div class="stat-card"><div class="stat-head"><span>Inntekter</span><div class="stat-icon green">${ico('down',20)}</div></div><div class="stat-number private-value">${fmt(m.income)}</div><div class="stat-note">${comparison(m.income,prev.income)} fra forrige måned</div></div><div class="stat-card"><div class="stat-head"><span>Utgifter</span><div class="stat-icon red">${ico('up',20)}</div></div><div class="stat-number private-value">${fmt(m.expense)}</div><div class="stat-note">${budgets}</div></div></div><div class="layout2">${donutCard()}<section class="card"><div class="card-head"><div><h2 class="card-title">Månedens nøkkeltall</h2><p class="card-hint">Netto og planlagt forbruk</p></div></div>${summary('Netto inn − ut',m.net)}${summary('Planlagte budsjetter',planned)}${summary('Resterende budsjett',planned-m.expense)}<div class="notice" style="margin-top:15px">${ico('info',16)} <span>Overføringer mellom egne kontoer regnes ikke som inntekt eller utgift.</span></div></section></div><div class="layout2"><section class="card"><div class="card-head"><div><h2 class="card-title">Siste posteringer</h2><p class="card-hint">Dette har skjedd i ${monthName(period)}</p></div><button class="btn btn-ghost btn-sm" data-action="page" data-page="transactions">Vis alle ${ico('right',15)}</button></div>${recent.length?`<div class="transaction-list">${recent.map(t=>transactionRow(t)).join('')}</div>`:empty('Ingen posteringer ennå','Legg til inntekt, utgift eller en overføring for å komme i gang.','add-transaction','Registrer postering')}</section>${budgetCard()}</div><div class="layout2">${upcomingCard()}<section class="card"><div class="card-head"><div><h2 class="card-title">Kontoer</h2><p class="card-hint">Saldo på denne enheten</p></div><button class="btn btn-ghost btn-sm" data-action="page" data-page="settings">Administrer ${ico('right',15)}</button></div><div class="stack">${state.accounts.map(a=>`<div class="summary-pill"><span>${esc(a.name)}</span><strong class="private-value">${fmt(accountBalance(a.id))}</strong></div>`).join('')}</div></section></div>`}
function comparison(current,previous){if(previous===0)return 'Ingen sammenligning';const diff=Math.round((current-previous)/previous*100);return `${diff>0?'+':''}${diff} %`}

function settingsPage(){return head('Innstillinger','Kontoer, faste poster og lokal datasikkerhet.','',false)+`<div class="settings-grid"><section class="settings-block"><div class="settings-head"><h3>Kontoer</h3><button class="btn btn-secondary btn-sm" data-action="add-account">${ico('plus',15)} Konto</button></div>${state.accounts.map(a=>`<div class="settings-item"><div><div class="settings-label">${esc(a.name)}</div><div class="settings-note">Saldo: <span class="private-value">${fmt(accountBalance(a.id))}</span> · Start: <span class="private-value">${fmt(a.opening)}</span></div></div><div class="actions"><button class="small-btn" data-action="edit-account" data-id="${esc(a.id)}" aria-label="Rediger konto">${ico('edit',16)}</button></div></div>`).join('')}${!state.accounts.length?`<div class="empty-strip">Ingen kontoer opprettet.</div>`:''}<p class="month-note">Saldo beregnes fra startsaldo og registrerte posteringer.</p></section><section class="settings-block"><div class="settings-head"><h3>Utseende og personvern</h3></div><div class="settings-item"><div><div class="settings-label">Tema</div><div class="settings-note">Lys, mørk eller automatisk</div></div><select class="select" id="theme-select" style="width:136px"><option value="system" ${state.settings.theme==='system'?'selected':''}>Automatisk</option><option value="light" ${state.settings.theme==='light'?'selected':''}>Lyst</option><option value="dark" ${state.settings.theme==='dark'?'selected':''}>Mørkt</option></select></div><div class="settings-item"><div><div class="settings-label">Skjul beløp</div><div class="settings-note">Tilslører beløp visuelt på skjermen</div></div><label class="inline-label"><input type="checkbox" id="privacy-toggle" ${state.settings.hideBalances?'checked':''}> Aktiv</label></div><div class="notice" style="margin-top:16px">${ico('lock',16)} Appen krever ingen innlogging. Bruk telefonens skjermlås og oppbevar sikkerhetskopien trygt.</div></section><section class="settings-block"><d ass="settings-head"><h3>Data og installasjon</h3></div><p class="section-subtitle" style="margin:0 0 14px">Lagring: <strong>${storageMode==='indexeddb'?'IndexedDB på enheten':storageMode==='localstorage'?'Lokal lagring (reserve)':'Kun i minnet – sikkerhetskopier nå'}</strong>. Appen virker uten nett etter PWA-installasjon.</p><div class="stack"><button class="btn btn-secondary" data-action="install-help">${ico('info',16)} Slik installerer du på iPhone</button><button class="btn btn-secondary" data-action="print">${ico('download',16)} Skriv ut / lagre PDF</button><button class="btn btn-danger" data-action="wipe">${ico('trash',16)} Slett alle data</button></div></section></div>`}

showModal(id?'Rediger postering':'Ny postering',body,()=>{const k=val('t-kind'),amount=parseAmount(val('t-amount')),date=val('t-date'),acc=val('t-account'),target=k==='transfer'?val('t-to'):null;const cat=k==='transfer'?null:val('t-category');if(!amount)return notify('Skriv et gyldig beløp større enn 0 (maks to desimaler).');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(new Date(date+'T12:00:00').getTime()))return notify('Velg gyldig dato.');if(!byId(acc)||k==='transfer'&&(!byId(target)||target===acc))return notify('Velg to forskjellige, gyldige kontoer.');if(k!=='transfer'&&!state.categories.some(c=>c.id===cat&&c.kind===k))return notify('Velg kategori.');const obj={id:old?.id||uid(),kind:k,amount,date,accountId:acc,toAccountId:target,categoryId:cat,note:val('t-note').trim(),recurringId:old?.recurringId&&k==='expense'?old.recurringId:null};if(old){state.transactions=state.transactions.map(t=>t.id===old.id?obj:t)}else state.transactions.push(obj);closeModal();commit(old?'Postering oppdatert':'Postering lagt til')},old?()=>{if(confirm('Vil du slette denne posteringen?')){state.transactions=state.transactions.filter(t=>t.id!==old.id);closeModal();commit('Postering slettet')}}:null);

function budgetModal(focus){const cells=state.categories.filter(x=>x.kind==='expense');const body=`<p class="section-subtitle">Budsjett for ${monthName(period)}. Tomme felter fjernes. Bruk beløp i kroner.</p><div class="form-grid">${cells.map(c=>`<div class="field mobile-full"><label for="b-${c.id}">${esc(c.emoji)} ${esc(c.name)}</label><input id="b-${c.id}" class="input" inputmode="decimal" placeholder="0" value="${state.budgets[period]?.[c.id]?inputMoney(state.budgets[period][c.id]):''}"></div>`).join('')}</div>`;showModal('Rediger månedsbudsjett',body,()=>{const newB={};for(const c of cells){const raw=val('b-'+c.id).trim();if(!raw)continue;const amount=parseAmount(raw);if(!amount)return notify('Ugyldig beløp for '+c.name);newB[c.id]=amount}state.budgets[period]=newB;closeModal();commit('Budsjettet er oppdatert')});if(focus)setTimeout(()=>document.getElementById('b-'+focus)?.focus(),20)}

function goalModal(id){const g=state.goals.find(x=>x.id===id);showModal(g?'Rediger sparemål':'Nytt sparemål',`<div class="form-grid"><div class="field full"><label for="g-name">Navn</label><input class="input" id="g-name" maxlength="70" placeholder="For eksempel buffer" value="${esc(g?.name||'')}"></div><div class="field"><label for="g-target">Målbeløp (kr)</label><input class="input" id="g-target" inputmode="decimal" placeholder="50 000" value="${g?inputMoney(g.target):''}"></div><div class="field"><label for="g-date">Måldato (valgfritt)</label><input class="input" type="date" id="g-date" value="${g?.date||''}"></div></div>`,()=>{const name=val('g-name').trim(),target=parseAmount(val('g-target'));if(!name||!target)return notify('Angi navn og målbeløp større enn 0.');if(g){Object.assign(g,{name,target,date:val('g-date')||null})}else state.goals.push({id:uid(),name,target,date:val('g-date')||null});closeModal();commit(g?'Sparemål oppdatert':'Sparemål opprettet')},g?()=>{if(confirm('Slette dette sparemålet og tilhørende sparehendelser?')){state.goals=state.goals.filter(x=>x.id!==g.id);state.contributions=state.contributions.filter(x=>x.goalId!==g.id);closeModal();commit('Sparemål slettet')}}:null)}
function contributionModal(goalId){const g=state.goals.find(x=>x.id===goalId);if(!g)return;showModal('Registrer sparing · '+g.name,`<div class="form-grid"><div class="field"><label for="c-amount">Beløp (kr)</label><input class="input" id="c-amount" inputmode="decimal" placeholder="0,00"></div><div class="field"><label for="c-date">Dato</label><input class="input" id="c-date" type="date" value="${localDate()}"></div><div class="field full"><label for="c-note">Notat (valgfritt)</label><input class="input" id="c-note" maxlength="100" placeholder="Beskrivelse"></div></div><p class="field-note" style="margin-top:13px">Dette registrerer kun fremdrift. Flytt penger mellom kontoer separat ved behov.</p>`,()=>{const amount=parseAmount(val('c-amount'));if(!amount)return notify('Skriv inn et gyldig sparebeløp.');state.contributions.push({id:uid(),goalId,date:val('c-date')||localDate(),amount,note:val('c-note').trim()});closeModal();commit('Sparing registrert')})}
function accountModal(id){const a=state.accounts.find(x=>x.id===id);showModal(a?'Rediger konto':'Ny konto',`<div class="form-grid"><div class="field full"><label for="a-name">Kontonavn</label><input class="input" id="a-name" maxlength="45" placeholder="For eksempel Sparekonto" value="${esc(a?.name||'')}"></div><div class="field"><label for="a-opening">Startsaldo i kr</label><input class="input" id="a-opening" inputmode="decimal" value="${a?inputMoney(Math.abs(a.opening)):'0,00'}" placeholder="0,00"><span class="field-note">Kan også være negativ</span></div><div class="field"><label for="a-sign">Fortegn startsaldo</label><select class="select" id="a-sign"><option value="plus" ${!a||a.opening>=0?'selected':''}>Positiv</option><option value="minus" ${a&&a.opening<0?'selected':''}>Negativ</option></select></div></div><p class="field-note" style="margin-top:13px">Startsaldoberegningen gjelder før samtlige registrerte posteringer i appen, ikke en bestemt dato.</p>`,()=>{const name=val('a-name').trim(),raw=val('a-opening'),number=raw.trim().replace(/[\s\u00a0\u202f]/g,'').replace(',','.');if(!name||!/^(?:\d+)(?:\.\d{1,2})?$/.test(number))return notify('Angi kontonavn og gyldig startsaldo.');const opening=Math.round(Number(number)*100)*(val('a-sign')==='minus'?-1:1);if(!Number.isSafeInteger(opening))return notify('Ugyldig beløp.');if(a){a.name=name;a.opening=opening}else state.accounts.push({id:uid(),name,opening,color:COLORS[state.accounts.length%COLORS.length]});closeModal();commit(a?'Konto oppdatert':'Konto opprettet')},a?()=>{if(state.transactions.some(t=>t.accountId===a.id||t.toAccountId===a.id)||state.recurring.some(r=>r.accountId===a.id))return notify('Kontoen er i bruk. Flytt eller slett tilknyttede poster først.');if(state.accounts.length===1)return notify('Du må ha minst én konto.');if(confirm('Slette konto '+a.name+'?')){state.accounts=state.accounts.filter(x=>x.id!==a.id);closeModal();commit('Konto slettet')}}:null)}
function recurringModal(id){const r=state.recurring.find(x=>x.id===id);if(!state.accounts.length)return notify('Opprett en konto først.');showModal(r?'Rediger fast post':'Ny fast post',`<div class="form-grid"><div class="field full"><label for="r-name">Beskrivelse</label><input class="input" id="r-name" maxlength="85" placeholder="For eksempel boliglån" value="${esc(r?.name||'')}"></div><div class="field"><label for="r-amount">Beløp (kr)</label><input class="input" id="r-amount" inputmode="decimal" value="${r?inputMoney(r.amount):''}" placeholder="0,00"></div><div class="field"><label for="r-day">Dag i måneden</label><input class="input" id="r-day" type="number" min="1" max="31" value="${r?.day||1}"></div><div class="field full"><label for="r-category">Kategori</label><select class="select" id="r-category">${options(state.categories.filter(x=>x.kind==='expense'),r?.categoryId||'housing')}</select></div><div class="field full"><label for="r-account">Trekkes fra konto</label><select class="select" id="r-account">${options(state.accounts,r?.accountId||'shared')}</select></div></div><p class="field-note" style="margin-top:13px">Når du bokfører i en måned opprettes én utgift. Måneder med færre dager bruker siste dato i måneden.</p>`,()=>{const name=val('r-name').trim(),amount=parseAmount(val('r-amount')),day=Number(val('r-day'));if(!name||!amount||!Number.isInteger(day)||day<1||day>31)return notify('Fyll inn navn, beløp og dag (1–31).');const obj={id:r?.id||uid(),name,amount,day,categoryId:val('r-category'),accountId:val('r-account'),active:true};if(!byId(obj.accountId))return notify('Velg en gyldig konto.');if(r)Object.assign(r,obj);else state.recurring.push(obj);closeModal();commit(r?'Fast post oppdatert':'Fast post opprettet')},r?()=>{if(confirm('Vil du slette denne faste posten? Historiske betalinger beholdes.')){state.recurring=state.recurring.filter(x=>x.id!==r.id);closeModal();commit('Fast post slettet')}}:null)}
function postRecurring(id){const r=state.recurring.find(x=>x.id===id);if(!r)return;if(state.transactions.some(t=>t.recurringId===id&&t.date.startsWith(period)))return notify('Denne posten er allerede bokført i valgt måned.');if(!byId(r.accountId))return notify('Kontoen til den faste posten finnes ikke.');const [y,m]=period.split('-').map(Number);const max=new Date(y,m,0).getDate();const date=`${period}-${String(Math.min(r.day,max)).padStart(2,'0')}`;state.transactions.push({id:uid(),kind:'expense',amount:r.amount,date,accountId:r.accountId,toAccountId:null,categoryId:r.categoryId,note:r.name,recurringId:r.id});commit('Fast post bokført for '+monthName(period))}
function exportFile(content,name,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(){exportFile(JSON.stringify({ ...state,backupCreatedAt:new Date().toISOString(),app:'MinØkonomi'},null,2),`minokonomi-backup-${localDate()}.json`,'application/json;charset=utf-8');notify('Sikkerhetskopi laget – lagre filen trygt')}
function csv(){const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['Dato','Type','Beløp (NOK)','Kategori','Konto','Til konto','Beskrivelse'],...state.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.kind,(t.kind==='expense'?'-':'')+(t.amount/100).toFixed(2).replace('.',','),t.kind==='transfer'?'':category(t.categoryId).name,byId(t.accountId)?.name||'',t.kind==='transfer'?byId(t.toAccountId)?.name||'':'',t.note||''])];exportFile('\ufeff'+rows.map(r=>r.map(quote).join(';')).join('\r\n'),`minokonomi-posteringer-${localDate()}.csv`,'text/csv;charset=utf-8');notify('CSV-fil eksportert')}
async function importBackup(file){if(!file)return;try{if(file.size>10*1024*1024)throw new Error('Filen er for stor (maks 10 MB).');const parsed=JSON.parse(await file.text());if(!validData(parsed))throw new Error('Filformatet stemmer ikke med MinØkonomi v1.');if(!confirm('Alle eksisterende data på denne enheten erstattes av sikkerhetskopien. Fortsette?'))return;state=normalizeData(parsed);page='overview';commit('Sikkerhetskopi gjenopprettet')}catch(e){notify('Import feilet: '+e.message)}finally{document.querySelector('#import-file').value=''}}
function demo(){if(!confirm('Eksempeldata erstatter ALT som ligger i appen. Ta sikkerhetskopi først hvis du vil beholde data. Fortsette?'))return;state=initial();const m=thisMonth(),prev=shiftMonth(m,-1);state.accounts[0].opening=850000;state.accounts[1].opening=1800000;state.accounts[2].opening=1600000;const sample=[['salary','income',4200000,'daily','Eksempellønn',5],['housing','expense',1200000,'shared','Eksempelhuskostnad',3],['car','expense',180000,'shared','Transport',4],['insurance','expense',130000,'shared','Forsikring',6],['food','expense',380000,'shared','Dagligvarer',8],['utilities','expense',170000,'shared','Internett og strøm',9],['family','expense',100000,'shared','Fritidsaktivitet',10],['subscriptions','expense',12900,'shared','Strømming',11],['food','expense',85000,'shared','Matbutikk',14],['leisure','expense',40000,'daily','Kafé',17]];for(const [cat,kind,amount,acc,note,day] of sample){const [year,month]=m.split('-').map(Number);const max=new Date(year,month,0).getDate();state.transactions.push({id:uid(),kind,amount,accountId:acc,toAccountId:null,categoryId:cat,note,date:m+'-'+String(Math.min(day,max)).padStart(2,'0'),recurringId:null})}state.transactions.push({id:uid(),kind:'transfer',amount:2000000,accountId:'daily',toAccountId:'shared',categoryId:null,note:'Til felleskonto',date:m+'-02',recurringId:null});state.budgets[m]={housing:1200000,car:200000,insurance:150000,food:550000,utilities:200000,family:180000,subscriptions:40000,leisure:150000};state.budgets[prev]={...state.budgets[m]};state.goals=[{id:'demo-buffer',name:'Bufferkonto',target:4000000,date:null},{id:'demo-holiday',name:'Ferie',target:3000000,date:null}];state.contributions=[{id:uid(),goalId:'demo-buffer',amount:1500000,date:m+'-01',note:'Oppspart'},{id:uid(),goalId:'demo-holiday',amount:700000,date:m+'-01',note:'Oppspart'}];state.recurring=[{id:uid(),name:'Huskostnad',amount:1200000,day:3,categoryId:'housing',accountId:'shared',active:true},{id:uid(),name:'Strøm',amount:90000,day:25,categoryId:'utilities',accountId:'shared',active:true}];page='overview';period=m;commit('Eksempeldata lastet inn – dette er ikke dine reelle tall')}
function wipe(){if(!confirm('Du er i ferd med å slette ALLE kontoer, posteringer, budsjetter og sparemål. Fortsette?'))return;if(!confirm('SISTE BEKREFTELSE: Er du sikker? Dette kan ikke angres uten sikkerhetskopi.'))return;state=initial();page='overview';period=thisMonth();commit('Alle data slettet')}
function installHelp(){showModal('Installer på iPhone',`<div class="stack" style="line-height:1.7"><div class="notice">${ico('info',17)} Appen må åpnes fra en HTTPS-adresse for full PWA-installasjon. En enkelt HTML-fil åpnet fra Filer gir ikke samme offline-installasjon.</div><div><strong>1. Publiser filene</strong><p class="muted tiny">Legg index.html, manifest.webmanifest, service-worker.js og begge PNG-ikonene i samme mappe på en HTTPS-tjener, for eksempel GitHub Pages.</p></div><div><strong>2. Åpne i Safari</strong><p class="muted tiny">Åpne den publiserte URL-en i Safari på iPhone.</p></div><div><strong>3. Legg til på Hjem-skjermen</strong><p class="muted tiny">Trykk Del → Legg til på Hjem-skjermen, aktiver «Åpne som webapp», og trykk Legg til.</p></div><div><strong>4. Test offline</strong><p class="muted tiny">Åpne appen minst én gang med nett, slå på flymodus og åpne den igjen. Eksporter deretter en JSON-sikkerhetskopi.</p></div><div class="muted-panel">Appens kildekode på en offentlig nettside er lesbar for andre. Dine personlige poster lagres likevel lokalt, og ingen bankdata sendes til nettstedet. Del aldri sikkerhetskopien offentlig.</div></div>`,()=>closeModal());document.querySelector('#modal-save').textContent='Lukk'}
async function action(btn){const a=btn.dataset.action,id=btn.dataset.id;switch(a){case'page':page=btn.dataset.page;txSearch='';window.scrollTo(0,0);render();break;case'page-budget':page='budget';render();break;case'prev-month':period=shiftMonth(period,-1);render();break;case'next-month':period=shiftMonth(period,1);render();break;case'add-transaction':transactionModal();break;case'edit-transaction':transactionModal(id);break;case'tx-filter':txFilter=btn.dataset.filter;render();break;case'edit-budget':budgetModal(id);break;case'copy-budget':copyBudget();break;case'add-goal':goalModal();break;case'edit-goal':goalModal(id);break;case'add-contribution':contributionModal(id);break;case'delete-contribution':if(confirm('Slette denne sparehendelsen?')){state.contributions=state.contributions.filter(x=>x.id!==id);commit('Sparehendelse slettet')}break;case'add-account':accountModal();break;case'edit-account':accountModal(id);break;case'add-recurring':recurringModal();break;case'edit-recurring':recurringModal(id);break;case'post-recurring':postRecurring(id);break;case'export-json':backup();break;case'import-json':document.querySelector('#import-file').click();break;case'export-csv':csv();break;case'demo':demo();break;case'wipe':wipe();break;case'install-help':installHelp();break;case'print':window.print();break;case'close-modal':closeModal();break;}}
function listen(){document.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(button)action(button).catch(errorMessage)});document.querySelector('#import-file').addEventListener('change',e=>importBackup(e.target.files?.[0]));document.addEventListener('change',e=>{if(e.target.id==='theme-select'){state.settings.theme=e.target.value;commit('Tema oppdatert')}if(e.target.id==='privacy-toggle'){state.settings.hideBalances=e.target.checked;commit('Visning oppdatert')}if(e.target.id==='tx-account'){txAccount=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='tx-search'){txSearch=e.target.value;const start=e.target.selectionStart,end=e.target.selectionEnd;render();const field=document.querySelector('#tx-search');field?.focus();field?.setSelectionRange(start,end)}});document.querySelector('#modal-layer').addEventListener('click',e=>{if(e.target.id==='modal-layer')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});window.addEventListener('online',()=>document.querySelector('#offline-alert').classList.remove('show'));window.addEventListener('offline',()=>document.querySelector('#offline-alert').classList.add('show'));matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(state.settings.theme==='system')theme()})}
async function start(){await initStorage();listen();render();if(storageMode==='volatile')notify('Advarsel: nettleseren kan ikke lagre data. Bruk en annen nettleser.');if(location.protocol==='https:'&&'serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(e=>console.warn('Service Worker kunne ikke registreres',e))}
start().catch(errorMessage);
})();
</script>
